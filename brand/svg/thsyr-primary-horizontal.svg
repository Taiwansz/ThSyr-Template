<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="100%">
  <defs>
    <linearGradient id="hGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="hGradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Símbolo à Esquerda -->
  <g transform="translate(20, 10) scale(0.39)">
    <polygon points="256,54 430,154 430,358 256,458 82,358 82,154" 
             fill="none" stroke="rgba(6, 182, 212, 0.35)" stroke-width="3" stroke-dasharray="8 8"/>
    <path d="M 148 152 L 324 152 L 376 204 L 376 244 L 324 244 L 292 212 L 216 212 L 216 244 L 296 288 L 244 340 L 148 268 Z" 
          fill="url(#hGradCyan)" filter="url(#hGlow)"/>
    <path d="M 364 360 L 188 360 L 136 308 L 136 268 L 188 268 L 220 300 L 296 300 L 296 268 L 216 224 L 268 172 L 364 244 Z" 
          fill="url(#hGradEmerald)" filter="url(#hGlow)"/>
    <polygon points="256,220 292,256 256,292 220,256" fill="#06B6D4" filter="url(#hGlow)"/>
    <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>
    <circle cx="148" cy="152" r="6" fill="#38BDF8"/>
    <circle cx="364" cy="360" r="6" fill="#10B981"/>
  </g>

  <!-- Divisor Vertical Técnico -->
  <line x1="250" y1="45" x2="250" y2="175" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Wordmark e Tagline à Direita -->
  <g transform="translate(280, 0)">
    <!-- Nome ThSyr -->
    <text x="0" y="118" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="76" letter-spacing="-2px" fill="#FFFFFF">
      Th<tspan fill="#06B6D4">Syr</tspan>
    </text>

    <!-- Tagline Principal -->
    <text x="4" y="152" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="13" letter-spacing="4px" fill="#94A3B8">
      SOVEREIGN COGNITIVE SIDECAR
    </text>

    <!-- Badge Técnico -->
    <rect x="340" y="74" width="170" height="24" rx="5" fill="rgba(16, 185, 129, 0.12)" stroke="#10B981" stroke-width="1"/>
    <text x="425" y="90" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1px">
      GROUND TRUTH CERTIFIED
    </text>
  </g>
</svg>